name: Reusable workflow to release in GitHub

# Workflow to create a release
# Triggered manually or by other workflows
on:
  workflow_call:
    inputs:
      artifact:
        type: string
        required: false
      file:
        type: string
        required: false
      tag:
        type: string
        required: true

jobs:
  release-workflow:
    name: Create GitHub Release
    runs-on: ${{ vars.UBUNTU_VERSION }}
    steps:
      # Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
      # Download the artifact if specified
      - uses: actions/download-artifact@v4
        if: ${{ inputs.artifact }}
        with:
          name: ${{ inputs.artifact }}
      # Create a new release using the provided tag
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: ${{ inputs.file }}
