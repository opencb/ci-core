name: Reusable workflow to build Java application

on:
  workflow_call:
    inputs:
      maven_opts:
        type: string
        required: false
      build_folder:
        type: string
        required: false
        default: "build-folder"
      upload_artifact:
        type: boolean
        required: false
        default: false
      java_version:
        type: string
        required: false
        default: "11"
      storage_hadoop:
        type: string
        required: false
        default: "hdi5.1"
      dependency_repos:
        type: string
        required: false
        default: ""
      needs_hadoop_preparation:
        type: boolean
        description: "If true, prepare Hadoop environment after setting up Java and Maven cache"
        required: false
        default: false
      deploy_maven:
        type: boolean
        description: "If true, deploy to Maven repository after building"
        required: false
        default: false
      ref:
        type: string
        required: false
    secrets:
      MAVEN_GPG_PASSPHRASE:
        required: false
      MAVEN_GPG_PRIVATE_KEY:
        required: false
      MAVEN_USER_TOKEN:
        required: false
      MAVEN_PASSWORD_TOKEN:
        required: false
      THIRDPARTY_READ_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository using the default branch if 'ref' is not provided
      - name: Checkout repository (default branch)
        if: ${{ !inputs.ref || inputs.ref == '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Checkout the repository using a specific ref if 'ref' is provided
      - name: Checkout repository (custom ref)
        if: ${{ inputs.ref && inputs.ref != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
      # Set up Java, dependencies, and Maven cache. This step also prepares the Hadoop environment and Maven deploy if requested.
      - name: Setup Java, dependencies and Maven cache
        id: setup_java_maven
        uses: opencb/ci-core/.github/actions/setup-java-maven@main
        with:
          java_version: ${{ inputs.java_version }}
          storage_hadoop: ${{ inputs.hadoop_flavour || vars.HADOOP_FLAVOUR }}
          dependency_repos: ${{ inputs.dependency_repos }}
          needs_hadoop_preparation: ${{ inputs.needs_hadoop_preparation }}
          deploy_maven: ${{ inputs.deploy_maven }}
          server-username: MAVEN_NEXUS_USER                       # Environment variable for username in deploy
          server-password: MAVEN_NEXUS_PASSWORD                   # Environment variable for token in deploy
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}   # Value of the GPG private key to import
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
        env:
          THIRDPARTY_READ_TOKEN: ${{ secrets.THIRDPARTY_READ_TOKEN }}

      # Build the Maven project without running tests if not deploying to Maven
      - name: Maven Build (skip tests)
        if: ${{ !inputs.deploy_maven }}
        run: mvn -T 2 clean install -DskipTests ${{ inputs.maven_opts }} --no-transfer-progress
      # Deploy the Maven project to Maven Central and GitHub Packages if requested
      - name: Maven Deploy (skip tests, deploy to Maven Central and GitHub Packages)
        if: ${{ inputs.deploy_maven }}
        run: mvn -T 2 clean deploy -DskipTests -Pdeploy-maven,deploy-github ${{ inputs.maven_opts }} --no-transfer-progress
        env:
          MAVEN_NEXUS_USER: ${{ secrets.MAVEN_USER_TOKEN }}
          MAVEN_NEXUS_PASSWORD: ${{ secrets.MAVEN_PASSWORD_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Upload build artifacts if requested by the caller
      - name: Upload build artifacts
        if: ${{ inputs.upload_artifact == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build_folder }}
          path: build

      # Extract the Maven project version and expose it as an output
      - name: Get project version
        id: get_project_version
        run: |
          echo "version=$(mvn help:evaluate -q -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      # Write a summary into the GitHub job summary for easy inspection
      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Java / Build summary"
            echo ""
            echo "- Build version: \`${{ steps.get_project_version.outputs.version}}\`"
            echo "- Hadoop flavour: \`${{ inputs.storage_hadoop }}\`"
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Branch: \`$GITHUB_REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
